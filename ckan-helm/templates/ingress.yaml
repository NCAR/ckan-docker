apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
  annotations:
    cert-manager.io/cluster-issuer: "incommon"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    #nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/server-snippet: |
      # Block requests identified as bad bots
      if ($bad_bot) {
        return 403;
      }
      # Only apply rate limiting if $do_limit is set (i.e., _tags_limit=0)
      if ($do_limit) {
        limit_req zone=mapped_limit burst=20 nodelay;
      }
spec:
  ingressClassName: nginx-internal
  tls:
    - hosts:
      - {{ .Values.webapp.tls.fqdn }}
      secretName: {{ .Values.webapp.tls.secretName }}
  rules:
  - host: {{ .Values.webapp.tls.fqdn }}
    http:
      paths:
      - path: {{ .Values.webapp.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.webapp.container.image }}
            port:
              number: {{ .Values.webapp.container.port }}